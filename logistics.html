<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доставка — LogiCore</title>
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/logistics.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<script src="../js/data/storage.js"></script>
<script src="../js/core/notifications.js"></script>
<script src="../js/core/auth.js"></script>
<script src="../js/core/permissions.js"></script>
<script src="../js/core/navigation.js"></script>
<script src="../js/data/seed.js"></script>
<script src="../js/data/backup.js"></script>
<script src="../js/ui/modal.js"></script>
<script src="../js/ui/table.js"></script>
<script src="../js/ui/forms.js"></script>
<script src="../js/ui/filters.js"></script>
<script src="../js/ui/sidebar.js"></script>
<script src="../js/ui/header.js"></script>
<script src="../js/modules/products.js"></script>
<script src="../js/modules/warehouse.js"></script>
<script src="../js/modules/inventory.js"></script>
<script src="../js/modules/receiving.js"></script>
<script src="../js/modules/shipping.js"></script>
<script src="../js/modules/orders.js"></script>
<script src="../js/modules/transport.js"></script>
<script src="../js/modules/routes.js"></script>
<script src="../js/modules/suppliers.js"></script>
<script src="../js/modules/finance.js"></script>
<script src="../js/modules/employees.js"></script>
<script src="../js/modules/reports.js"></script>
<script src="../js/core/app.js"></script>
<script>
(function(){
  var content=App.initLayout('logistics','Доставка');
  if(!content)return;
  var S=Storage;

  var routes=Routes.all();
  var inTransit=routes.filter(function(r){return r.status==='in_transit';});
  var planned=routes.filter(function(r){return r.status==='planned';});

  content.innerHTML=
    '<div class="page-head"><div><h2>Доставка</h2><p>Обзор рейсов и доставок в реальном времени (демо-режим).</p></div></div>'+
    '<div class="map-placeholder">'+
      '<h3>Карта маршрутов</h3>'+
      '<p>Встроенная GPS-навигация недоступна без серверной интеграции. Ниже — сводка по активным рейсам.</p>'+
      '<div class="map-pins">'+
        routes.map(function(r){
          var t=Transport.find(r.transportId);
          return '<div class="map-pin">'+r.number+' · '+r.from+' → '+r.to+' · '+(t?t.plate:'—')+'</div>';
        }).join('')+
      '</div>'+
      '<div class="alert">Рейсов в пути: <strong>'+inTransit.length+'</strong> · Запланировано: <strong>'+planned.length+'</strong></div>'+
    '</div>'+
    '<div class="card" style="margin-top:18px"><div class="card__head"><h3>Активные рейсы</h3></div><div class="card__body" id="table"></div></div>';

  Table.render(document.getElementById('table'),{
    rows:routes.filter(function(r){return r.status==='in_transit'||r.status==='planned';}),
    pageSize:10, emptyText:'Активных рейсов нет',
    columns:[
      { key:'number', label:'Рейс' },
      { key:'from', label:'Откуда' },
      { key:'to', label:'Куда' },
      { key:'transportId', label:'ТС', render:function(r){var t=Transport.find(r.transportId);return t?t.plate:'—';} },
      { key:'driverId', label:'Водитель', render:function(r){var d=Transport.driverFind(r.driverId);return d?d.name:'—';} },
      { key:'status', label:'Статус', render:function(r){
        var map={planned:'status--new',in_transit:'status--transit'};
        return '<span class="status '+(map[r.status]||'')+'">'+(Routes.STATUS[r.status]||r.status)+'</span>';
      }}
    ]
  });
})();
</script>
</body>
</html>
